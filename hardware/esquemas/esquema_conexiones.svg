<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#FFFFFF"/>
  <text x="380" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Esquema de conexiones – Medidor UV con semáforo (v2)</text>

  <!-- ESP32 -->
  <rect x="60" y="70" width="230" height="340" rx="10" fill="#2C2C2A"/>
  <text x="175" y="100" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ESP32 DevKit</text>
  <text x="175" y="120" font-size="11" fill="#D3D1C7" text-anchor="middle">USB: chip CP2102 (COM)</text>
  <g font-size="13" fill="#FFFFFF" text-anchor="end">
    <text x="280" y="155">3V3</text>
    <text x="280" y="185">D34</text>
    <text x="280" y="215">GND</text>
    <text x="280" y="275">D25</text>
    <text x="280" y="305">D26</text>
    <text x="280" y="335">D27</text>
    <text x="280" y="365">GND</text>
  </g>
  <g fill="#EF9F27">
    <rect x="286" y="146" width="10" height="10"/><rect x="286" y="176" width="10" height="10"/>
    <rect x="286" y="206" width="10" height="10"/><rect x="286" y="266" width="10" height="10"/>
    <rect x="286" y="296" width="10" height="10"/><rect x="286" y="326" width="10" height="10"/>
    <rect x="286" y="356" width="10" height="10"/>
  </g>

  <!-- Sensor UV -->
  <rect x="520" y="120" width="180" height="120" rx="10" fill="#C0392B"/>
  <text x="625" y="150" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sensor UV</text>
  <text x="625" y="168" font-size="11" fill="#FADBD8" text-anchor="middle">GUVA-S12SD (Keyes)</text>
  <g font-size="13" fill="#FFFFFF"><text x="536" y="155">VCC</text></g>
  <g font-size="13" fill="#FFFFFF">
    <text x="536" y="185">S</text>
    <text x="536" y="215">GND</text>
  </g>
  <g fill="#EF9F27"><rect x="510" y="146" width="10" height="10"/><rect x="510" y="176" width="10" height="10"/><rect x="510" y="206" width="10" height="10"/></g>

  <!-- Semáforo -->
  <rect x="520" y="255" width="180" height="125" rx="10" fill="#1F1F1F"/>
  <text x="640" y="287" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Semáforo</text>
  <text x="640" y="303" font-size="11" fill="#D3D1C7" text-anchor="middle">módulo LED V1224</text>
  <g font-size="13" fill="#FFFFFF">
    <text x="536" y="276">R</text><text x="536" y="306">Y</text><text x="536" y="336">G</text><text x="536" y="366">GND</text>
  </g>
  <g fill="#EF9F27"><rect x="510" y="266" width="10" height="10"/><rect x="510" y="296" width="10" height="10"/><rect x="510" y="326" width="10" height="10"/><rect x="510" y="356" width="10" height="10"/></g>
  <circle cx="615" cy="335" r="9" fill="#E24B4A"/><circle cx="640" cy="335" r="9" fill="#EF9F27"/><circle cx="665" cy="335" r="9" fill="#639922"/>

  <!-- Cables -->
  <g stroke-width="3.5" fill="none" stroke-linecap="round">
    <line x1="296" y1="151" x2="510" y2="151" stroke="#E24B4A"/>
    <line x1="296" y1="181" x2="510" y2="181" stroke="#7F77DD"/>
    <line x1="296" y1="211" x2="510" y2="211" stroke="#444441"/>
    <line x1="296" y1="271" x2="510" y2="271" stroke="#D85A30"/>
    <line x1="296" y1="301" x2="510" y2="301" stroke="#BA7517"/>
    <line x1="296" y1="331" x2="510" y2="331" stroke="#639922"/>
    <line x1="296" y1="361" x2="510" y2="361" stroke="#444441"/>
  </g>

  <!-- Leyenda -->
  <g font-size="12" fill="#333">
    <text x="60" y="440">Rojo: 3,3 V · Morado: señal analógica del sensor (ADC1) · Negro: GND · Naranjo/amarillo/verde: salidas digitales a cada LED</text>
  </g>
</svg>
